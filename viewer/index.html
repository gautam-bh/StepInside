<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StepInside Viewer</title>
<style>
  :root { --bg: #111; --fg: #eee; --muted: #999; --accent: #4fc3f7; --panel: rgba(20,20,20,0.85); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }
  #panel { position: absolute; top: 12px; left: 12px; background: var(--panel); padding: 10px 12px;
    border-radius: 8px; max-width: 260px; }
  #panel h1 { font-size: 14px; margin: 0 0 6px; }
  #panel .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  button { background: #2a2a2a; color: var(--fg); border: 1px solid #444; border-radius: 5px;
    padding: 4px 8px; font: inherit; cursor: pointer; }
  button.on { border-color: var(--accent); color: var(--accent); }
  #pos { font-family: ui-monospace, Menlo, monospace; color: var(--muted); }
  .help { color: var(--muted); font-size: 12px; }
  #err { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    padding: 24px; text-align: center; }
  #toggle { position: absolute; top: 12px; left: 12px; display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="stage"></div>
<div id="panel">
  <h1>StepInside: <span id="scene-name"></span></h1>
  <div class="row">
    <button id="b-fill" title="F">Simple fill</button>
    <button id="b-fg" class="on" title="G">Foreground</button>
    <button id="b-edges" title="H">Box edges</button>
  </div>
  <div class="row">
    <button id="b-wiggle" title="Space">Wiggle</button>
    <button id="b-reset" title="R">Reset</button>
    <button id="b-hide">Hide panel</button>
  </div>
  <div id="pos"></div>
  <p class="help">
    Drag to move sideways and up/down · scroll or W/S to walk forward and back ·
    A/D strafe · Q/E up/down · Shift+drag to look around.<br>
    Holes (no photo data) show in magenta.
  </p>
</div>
<button id="toggle">Show panel</button>
<div id="err"></div>

<script type="module">
import * as THREE from "three";

const params = new URLSearchParams(location.search);
const sceneName = params.get("scene") || "hallway";
const base = `../scenes/${sceneName}/`;
document.getElementById("scene-name").textContent = sceneName;

const HOLE_COLOR = 0xff00ff;
const state = { fill: false, fg: true, edges: false, wiggle: false, t0: 0 };

function fail(msg) {
  const e = document.getElementById("err");
  e.style.display = "flex";
  e.innerHTML = msg;
}

let meta;
try {
  const r = await fetch(base + "scene.json");
  if (!r.ok) throw new Error(r.status + " " + r.statusText);
  meta = await r.json();
} catch (e) {
  fail(`Couldn't load <code>${base}scene.json</code> (${e.message}).<br><br>
        Build it with <code>python scripts/build_scene.py data/annotations/${sceneName}.json</code>,
        then serve the repo root with <code>python -m http.server</code> and open
        <code>http://localhost:8000/viewer/?scene=${sceneName}</code>.`);
  throw e;
}

// ---- renderer & camera matching the input photo ----------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById("stage").appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(HOLE_COLOR);

// The vanishing point is the principal point, so it is generally off-center
// in the photo. Model the photo as a sub-window of a larger frame centered on
// it, using setViewOffset.
const { width: W, height: H, focal: F } = meta;
const [vx, vy] = meta.principal;
const fullW = 2 * Math.max(vx, W - vx);
const fullH = 2 * Math.max(vy, H - vy);
const fovY = THREE.MathUtils.radToDeg(2 * Math.atan(fullH / 2 / F));
const camera = new THREE.PerspectiveCamera(fovY, fullW / fullH, 0.01, 200);
camera.setViewOffset(fullW, fullH, fullW / 2 - vx, fullH / 2 - vy, W, H);

// ---- planes ----------------------------------------------------------------
const loader = new THREE.TextureLoader();
const loadTex = (file) => new Promise((res, rej) =>
  loader.load(base + file, (t) => { t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy(); res(t); }, undefined, rej));

function quad(corners) {
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(corners.flat(), 3));
  // Corners: top-left, top-right, bottom-right, bottom-left of the texture.
  g.setAttribute("uv", new THREE.Float32BufferAttribute([0, 1, 1, 1, 1, 0, 0, 0], 2));
  g.setIndex([0, 3, 1, 1, 3, 2]);
  return g;
}

const boxMeshes = [], fgMeshes = [], edgeLines = [];
await Promise.all(meta.planes.map(async (p) => {
  const geo = quad(p.corners);
  const raw = await loadTex(p.texture);
  if (p.kind === "box") {
    const filled = await loadTex(p.texture_filled);
    const mat = new THREE.MeshBasicMaterial({ map: raw, side: THREE.DoubleSide, alphaTest: 0.5 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.userData = { raw, filled };
    boxMeshes.push(mesh);
    scene.add(mesh);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo),
      new THREE.LineBasicMaterial({ color: 0x00e5ff }));
    edges.visible = false;
    edgeLines.push(edges);
    scene.add(edges);
  } else {
    // Foreground cutouts are always drawn over the box (classic TIP).
    const mat = new THREE.MeshBasicMaterial({ map: raw, side: THREE.DoubleSide, alphaTest: 0.5,
      depthTest: false, depthWrite: false });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.renderOrder = 10;
    fgMeshes.push(mesh);
    scene.add(mesh);
  }
}));

// ---- camera state & controls ------------------------------------------------
const box = meta.box;
const limits = {
  x: [box.x[0] + 0.1, box.x[1] - 0.1],
  y: [box.y[0] + 0.3, box.y[1] - 0.1],
  z: [box.z[1] + 0.5, 1.0], // forward is -z; allow stepping back 1 m
};
const pose = { x: 0, y: 0, z: 0, yaw: 0, pitch: 0 };
const clamp = (v, [a, b]) => Math.min(b, Math.max(a, v));

function applyPose() {
  let { x, y, z, yaw, pitch } = pose;
  if (state.wiggle) {
    const t = (performance.now() - state.t0) / 1000;
    x += 0.35 * Math.sin(t * 1.3);
    y += 0.08 * Math.sin(t * 2.6);
    z -= 0.4 * (1 - Math.cos(t * 0.65));
  }
  camera.position.set(clamp(x, limits.x), clamp(y, limits.y), clamp(z, limits.z));
  camera.rotation.set(THREE.MathUtils.degToRad(pitch), THREE.MathUtils.degToRad(-yaw), 0, "YXZ");
  document.getElementById("pos").textContent =
    `x ${camera.position.x.toFixed(2)}  y ${camera.position.y.toFixed(2)}  ` +
    `fwd ${(-camera.position.z).toFixed(2)} m` + (yaw || pitch ? `  yaw ${yaw.toFixed(0)}° pitch ${pitch.toFixed(0)}°` : "");
}

function setButtons() {
  document.getElementById("b-fill").classList.toggle("on", state.fill);
  document.getElementById("b-fg").classList.toggle("on", state.fg);
  document.getElementById("b-edges").classList.toggle("on", state.edges);
  document.getElementById("b-wiggle").classList.toggle("on", state.wiggle);
  for (const m of boxMeshes) {
    m.material.map = state.fill ? m.userData.filled : m.userData.raw;
    m.material.needsUpdate = true;
  }
  fgMeshes.forEach((m) => (m.visible = state.fg));
  edgeLines.forEach((e) => (e.visible = state.edges));
}

const actions = {
  fill: () => { state.fill = !state.fill; setButtons(); },
  fg: () => { state.fg = !state.fg; setButtons(); },
  edges: () => { state.edges = !state.edges; setButtons(); },
  wiggle: () => { state.wiggle = !state.wiggle; state.t0 = performance.now(); setButtons(); },
  reset: () => { Object.assign(pose, { x: 0, y: 0, z: 0, yaw: 0, pitch: 0 }); state.wiggle = false; setButtons(); },
};
document.getElementById("b-fill").onclick = actions.fill;
document.getElementById("b-fg").onclick = actions.fg;
document.getElementById("b-edges").onclick = actions.edges;
document.getElementById("b-wiggle").onclick = actions.wiggle;
document.getElementById("b-reset").onclick = actions.reset;
document.getElementById("b-hide").onclick = () => {
  document.getElementById("panel").style.display = "none";
  document.getElementById("toggle").style.display = "block";
};
document.getElementById("toggle").onclick = () => {
  document.getElementById("panel").style.display = "block";
  document.getElementById("toggle").style.display = "none";
};

const canvas = renderer.domElement;
let drag = null;
canvas.addEventListener("pointerdown", (e) => {
  drag = { x: e.clientX, y: e.clientY, look: e.shiftKey, pose: { ...pose } };
  canvas.setPointerCapture(e.pointerId);
  canvas.classList.add("dragging");
});
canvas.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const s = 1 / canvas.clientHeight;
  const dx = (e.clientX - drag.x) * s, dy = (e.clientY - drag.y) * s;
  if (drag.look) {
    pose.yaw = clamp(drag.pose.yaw + dx * 60, [-30, 30]);
    pose.pitch = clamp(drag.pose.pitch - dy * 60, [-25, 25]);
  } else {
    // Drag the scene: dragging right moves the camera left.
    pose.x = clamp(drag.pose.x - dx * 1.5, limits.x);
    pose.y = clamp(drag.pose.y + dy * 1.5, limits.y);
  }
});
const endDrag = () => { drag = null; canvas.classList.remove("dragging"); };
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  pose.z = clamp(pose.z + e.deltaY * 0.004, limits.z);
}, { passive: false });

const keys = new Set();
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "f") actions.fill();
  else if (k === "g") actions.fg();
  else if (k === "h") actions.edges();
  else if (k === "r") actions.reset();
  else if (k === " ") { e.preventDefault(); actions.wiggle(); }
  else keys.add(k);
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));

function stepKeys(dt) {
  const v = 1.2 * dt; // m/s
  const d = (a, b) => (keys.has(a) ? 1 : 0) - (keys.has(b) ? 1 : 0);
  pose.x = clamp(pose.x + v * (d("d", "a") + d("arrowright", "arrowleft")), limits.x);
  pose.z = clamp(pose.z - v * (d("w", "s") + d("arrowup", "arrowdown")), limits.z);
  pose.y = clamp(pose.y + v * d("e", "q"), limits.y);
}

// ---- layout & loop ------------------------------------------------------------
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  renderer.setSize(Math.floor(W * s), Math.floor(H * s));
}
addEventListener("resize", resize);
resize();
setButtons();

let last = performance.now();
renderer.setAnimationLoop((now) => {
  stepKeys(Math.min(0.05, (now - last) / 1000));
  last = now;
  applyPose();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
